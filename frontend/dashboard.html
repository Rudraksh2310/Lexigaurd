<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your documents — LexiGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .page { padding: 36px 0 80px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .page-head .lede { margin-top: 10px; font-size: var(--t-md); }
  .page-head .lede strong { color: var(--ink); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .search { position: relative; flex: 1 1 240px; max-width: 360px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-faint); }
  .search .input { padding-left: 40px; min-height: 42px; }
  .seg { display: inline-flex; background: #E2E7DF; border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; font-size: var(--t-sm); font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(27,35,64,.12); }
  select.input { width: auto; min-height: 42px; padding-right: 34px; }

  .register { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .entry { display: grid; grid-template-columns: 118px minmax(0, 1fr) 170px 110px 40px; gap: 18px; align-items: center; padding: 18px 8px 18px 4px; border-bottom: 1px solid var(--rule); position: relative; }
  .entry:hover { background: rgba(255,255,255,.55); }
  .entry .stamp { justify-self: start; }
  .entry-title { font: 600 1.06rem/1.35 var(--serif); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  .entry-title::after { content: ""; position: absolute; inset: 0; }   /* whole row opens the document */
  .entry-title:hover { color: var(--seal-deep); text-decoration: underline; }
  .entry-meta { font-size: var(--t-xs); color: var(--ink-faint); margin-top: 3px; }
  .entry-sum { font-size: var(--t-sm); color: var(--ink-soft); margin: 6px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule); }
  .bar span { display: block; }
  .bar .High { background: var(--high-line); } .bar .Medium { background: var(--med-line); } .bar .Low { background: var(--low-line); }
  .bar-label { font-size: var(--t-xs); color: var(--ink-soft); margin-top: 6px; }
  .entry-date { font-size: var(--t-xs); color: var(--ink-faint); }
  .entry .btn-icon { position: relative; z-index: 1; color: var(--ink-faint); }
  .entry .btn-icon:hover { color: var(--high); }

  .aside h2 { font: 600 var(--t-md)/1.3 var(--sans); margin: 0 0 4px; }
  .aside .hint { margin: 0 0 16px; }
  .topic { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: var(--t-sm); }
  .topic .bar { grid-column: 1 / -1; height: 5px; background: transparent; }
  .aside-card { padding: 20px 22px; }

  .empty { padding: clamp(32px, 6vw, 64px); text-align: left; max-width: 640px; }
  .empty .h2 { margin-bottom: 10px; }
  .empty p { color: var(--ink-soft); margin: 0 0 24px; max-width: 34em; }
  .skeleton { height: 86px; border-bottom: 1px solid var(--rule); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent) no-repeat; background-size: 40% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .none-match { padding: 28px 4px; color: var(--ink-soft); }

  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .aside { order: 2; } }
  @media (max-width: 820px) {
    .entry { grid-template-columns: 96px minmax(0, 1fr) 40px; }
    .entry .flags-col, .entry .entry-date { display: none; }
    .entry-meta .m-date { display: inline; }
  }
  .m-date { display: none; }
</style>
</head>
<body>
<header id="topbar" class="topbar"></header>
<main class="page">
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1 class="h1">Your documents</h1>
        <p class="lede" id="summary">&nbsp;</p>
      </div>
    </div>
    <div class="layout">
      <section aria-label="Documents">
        <div class="tools" id="tools" hidden>
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zm9 2l-4-4"/></svg><span class="visually-hidden">Search documents</span><input class="input" id="q" type="search" placeholder="Search by file name or summary"></label>
          <div class="seg" role="group" aria-label="Filter by risk" id="seg">
            <button type="button" data-f="all" aria-pressed="true">All</button>
            <button type="button" data-f="High" aria-pressed="false">High risk</button>
            <button type="button" data-f="Medium" aria-pressed="false">Medium</button>
            <button type="button" data-f="Low" aria-pressed="false">Low</button>
          </div>
          <label><span class="visually-hidden">Document type</span><select class="input" id="type"><option value="">All types</option></select></label>
        </div>
        <ul class="register" id="list" aria-live="polite">
          <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
        </ul>
      </section>
      <aside class="aside" id="aside" hidden>
        <div class="sheet aside-card" id="drafts-card" hidden style="margin-bottom:18px">
          <h2>Your drafts</h2>
          <p class="hint">Documents you're writing with the AI</p>
          <div id="drafts-list"></div>
          <a class="btn btn-sm" href="draft.html" style="margin-top:14px">Draft a document</a>
        </div>
        <div class="sheet aside-card" id="topics-card">
          <h2>What keeps coming up</h2>
          <p class="hint">Clause types flagged across all your documents</p>
          <div id="topics"></div>
        </div>
      </aside>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const { el } = LG;
  const user = await LG.requireUser();
  LG.topbar(user, "documents");
  const list = document.getElementById("list");
  let docs = [], filter = "all";

  let data, stats;
  try { [data, stats] = await Promise.all([LG.api("/api/contracts"), LG.api("/api/stats")]); }
  catch (err) { list.replaceChildren(el("li", { class: "none-match" }, err.message)); return; }
  docs = data;

  const n = docs.length, high = docs.filter((d) => d.overall_risk_score === "High").length;
  const summary = document.getElementById("summary");
  if (!n) summary.textContent = "Documents you check are saved here, so you can come back to the highlights and the conversation.";
  else summary.replaceChildren(`${n} document${n === 1 ? "" : "s"} checked. `,
    high ? el("strong", {}, `${high} ${high === 1 ? "has" : "have"} serious clauses`) : "None has serious clauses.",
    high ? " to look at before you sign." : "");

  if (!n) {
    list.replaceWith(el("div", { class: "sheet empty" },
      el("h2", { class: "h2" }, "Nothing checked yet"),
      el("p", {}, "Upload an offer letter, a rent agreement, a client contract or any terms you've been asked to accept. You'll get the risky clauses marked and explained in a minute or two."),
      el("a", { class: "btn btn-primary", href: "analyze.html" }, LG.icon("upload"), "Check your first document")));
    return;
  }

  document.getElementById("tools").hidden = false;
  const typeSel = document.getElementById("type");
  [...new Map(docs.filter((d) => d.document_type).map((d) => [d.document_type, d.document_label])).entries()]
    .forEach(([v, l]) => typeSel.append(el("option", { value: v }, l)));

  function row(d) {
    const total = d.total_flags || 0;
    const bar = el("div", { class: "bar", role: "img", "aria-label": `${d.high_count} high, ${d.medium_count} medium, ${d.low_count} low` },
      ["High", "Medium", "Low"].map((L) => {
        const c = d[L.toLowerCase() + "_count"] || 0;
        return c ? el("span", { class: L, style: `width:${(c / total) * 100}%` }) : null;
      }));
    const side = d.perspective ? `, as the ${d.perspective}` : "";
    return el("li", { class: "entry" },
      LG.stamp(d.overall_risk_score || "Low", { size: "sm" }),
      el("div", {},
        el("a", { class: "entry-title", href: `review.html#${encodeURIComponent(d.id)}` }, d.filename),
        el("div", { class: "entry-meta" }, `${d.document_label || "Legal document"}${side}`, el("span", { class: "m-date" }, `. ${LG.fmtDate(d.uploaded_at)}`)),
        d.contract_summary ? el("p", { class: "entry-sum" }, d.contract_summary) : null),
      el("div", { class: "flags-col" }, total ? bar : null, el("div", { class: "bar-label" }, total ? `${total} flag${total === 1 ? "" : "s"}: ${d.high_count} high, ${d.medium_count} medium, ${d.low_count} low` : "No red flags found")),
      el("div", { class: "entry-date" }, LG.fmtDate(d.uploaded_at)),
      el("button", { class: "btn btn-quiet btn-icon", type: "button", title: `Delete ${d.filename}`, "aria-label": `Delete ${d.filename}`,
        onclick: async (e) => {
          e.preventDefault();
          if (!(await LG.confirm("Delete this document?", `${d.filename}, its highlights, report and conversation will be deleted. This can't be undone.`))) return;
          try { await LG.api(`/api/contracts/${d.id}`, { method: "DELETE" }); docs = docs.filter((x) => x.id !== d.id); render(); LG.toast("Document deleted"); }
          catch (err) { LG.toast(err.message, { error: true }); }
        } }, LG.icon("trash")));
  }

  function render() {
    const q = document.getElementById("q").value.trim().toLowerCase(), t = typeSel.value;
    const shown = docs.filter((d) => (filter === "all" || d.overall_risk_score === filter) && (!t || d.document_type === t) &&
      (!q || (d.filename + " " + (d.contract_summary || "")).toLowerCase().includes(q)));
    list.replaceChildren(...(shown.length ? shown.map(row) : [el("li", { class: "none-match" }, "No documents match. Clear the search or filters to see everything.")]));
    if (!docs.length) location.reload();
  }
  document.getElementById("q").addEventListener("input", render);
  typeSel.addEventListener("change", render);
  document.getElementById("seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
  render();

  // Aside: most common clause types across all documents
  const byCat = {};
  (stats.category_breakdown || []).forEach((r) => {
    const c = (byCat[r.category] = byCat[r.category] || { n: 0, worst: "Low" });
    c.n += r.count; if (LG.RANK[r.risk_level] > LG.RANK[c.worst]) c.worst = r.risk_level;
  });
  const top = Object.entries(byCat).sort((a, b) => b[1].n - a[1].n).slice(0, 7);
  document.getElementById("topics-card").hidden = !top.length;
  LG.api("/api/drafts").then((ds) => {
    if (!ds.length) return;
    document.getElementById("drafts-list").replaceChildren(...ds.slice(0, 4).map((d) => el("div", { class: "topic" },
      el("a", { href: `draft.html#${d.id}`, style: "color:var(--ink);font-weight:500" }, d.title), el("span", { class: "faint tiny" }, LG.fmtDate(d.updated_at)))));
    document.getElementById("drafts-card").hidden = false;
    document.getElementById("aside").hidden = false;
  }).catch(() => {});
  if (top.length) {
    const max = top[0][1].n;
    document.getElementById("topics").replaceChildren(...top.map(([cat, v]) => el("div", { class: "topic" },
      el("span", {}, cat), el("span", { class: "faint" }, v.n),
      el("div", { class: "bar" }, el("span", { class: v.worst, style: `width:${(v.n / max) * 100}%;border-radius:3px` })))));
    document.getElementById("aside").hidden = false;
  }
})();
</script>
</body>
</html>
